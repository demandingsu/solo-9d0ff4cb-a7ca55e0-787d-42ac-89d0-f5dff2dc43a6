services:
  bus-clearance:
    build: .
    image: bus-clearance-ledger:latest
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "change-me-before-production"
      DATA_DIR: /app/data
    volumes:
      - clearance-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  clearance-data:
